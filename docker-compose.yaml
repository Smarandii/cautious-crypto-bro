services:
  redis:
    # Left on a floating tag deliberately, unlike the Dockerfile base image.
    # Redis is an external service the operator pulls, so an unpinned tag means
    # 7.x patches arrive without anyone remembering to bump a digest. Pin this
    # too if a Dependabot run confirms the docker ecosystem also covers
    # docker-compose.yaml.
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_state:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      TELEGRAM_SESSION_NAME: /state/cautious_crypto_bro
      DATABASE_PATH: /state/cautious_crypto_bro.sqlite3
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEMO_LONG_RISK_MULTIPLIER: "0.10"
      DEMO_LONG_EXIT_CONTROL_FRACTION: "0.50"
      DEMO_LONG_PARTICIPATION_SKIP_FRACTION: "0.50"
      DEMO_PORTFOLIO_STOP_RISK_CAP_USDT: "400"
      DEMO_EXIT_PROFILE: payoff_early_tight_trail_long_015
      DEMO_ENTRY_ORDER_TTL_MINUTES: "240"
    volumes:
      - app_state:/state
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - ./docs:/app/docs:ro

volumes:
  app_state:
  redis_state:
