services:
  app:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      TELEGRAM_SESSION_NAME: /state/cautious_crypto_bro
      DATABASE_PATH: /state/cautious_crypto_bro.sqlite3
    volumes:
      - app_state:/state
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  app_state:
