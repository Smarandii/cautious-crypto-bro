name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Release / tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # project.version was hand-edited and v1.0.0 shipped as a merged pull
      # request with no tag at all. Nothing caught either. This refuses to
      # publish a release whose tag, declared version and changelog disagree.
      - name: Assert tag, version and changelog agree
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          declared="$(python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"

          echo "tag      : ${tag}"
          echo "declared : ${declared}"

          if [ "${tag}" != "v${declared}" ]; then
            echo "::error::Tag ${tag} does not match pyproject.toml version ${declared}."
            echo "::error::Bump project.version, or retag as v${declared}."
            exit 1
          fi

          python3 scripts/release_section.py "${tag}" > /dev/null

          echo "changelog section present for ${tag}"

      - name: Build distributions
        run: uv build

      - name: Verify the wheel installs
        run: |
          set -euo pipefail
          python3 -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python -c "import cautious_crypto_bro; print('import ok')"

      - name: Keep verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist
          if-no-files-found: error

  publish:
    name: Release / publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Download verified distributions
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-distributions
          path: dist

      # The changelog section for this tag becomes the release body, so the
      # published release and the repository file cannot drift apart.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python3 scripts/release_section.py "${GITHUB_REF_NAME}" > /tmp/notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            dist/*.whl \
            dist/*.tar.gz
