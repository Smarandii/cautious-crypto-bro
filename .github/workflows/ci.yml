name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python / quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Repository hygiene
        env:
          SKIP: ruff-format,ruff-check,pyright,droast
        run: uv run pre-commit run --all-files

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Build and verify distributions
        run: |
          mkdir .release-check-cache
          printf 'synthetic local-only canary\n' > .release-check-cache/private-canary.txt
          printf 'synthetic local-only canary\n' > .env.production
          uv build
          uv run python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          archive, = Path("dist").glob("*.tar.gz")
          with tarfile.open(archive) as source:
              names = {name.split("/", 1)[1] for name in source.getnames() if "/" in name}
          assert ".env.production" not in names
          assert not any(name.startswith(".release-check-cache/") for name in names)
          assert {
              "src/cautious_crypto_bro/main.py", "scripts/list_telegram_dialogs.py",
              "tests/test_main.py", "docs/index.html", ".env.example",
              "pyproject.toml", "uv.lock", "README.md", "LICENSE",
          } <= names
          wheel, = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as built:
              assert "cautious_crypto_bro/main.py" in built.namelist()
              assert not any("private-canary" in name or name.endswith(".env.production") for name in built.namelist())
          PY
          uv venv "$RUNNER_TEMP/package-install"
          uv pip install --python "$RUNNER_TEMP/package-install/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-install/bin/python" -c "import cautious_crypto_bro.main; print('Installed wheel imports successfully')"

      - name: Tests (unit, integration and smoke)
        run: uv run pytest -q
