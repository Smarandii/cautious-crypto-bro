name: Containers

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "docker-compose.yaml"
      - "docker-compose.dev.yaml"
      - ".dockerignore"
      - ".gitignore"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/container.yml"
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  droast:
    name: Dockerfile / droast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Dockerfiles
        uses: immanuwell/dockerfile-roast@1c87b2aa189338c24db4acde40864dae8994de8f # v1.7.0
        with:
          files: .
          preset: production
          min-severity: warning
          fail-on: warning
          no-roast: true
          image-tag: 1.7.0

      - name: Verify isolated local Docker lint
        run: python3 scripts/lint_dockerfiles.py Dockerfile

  docker:
    name: Docker / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify private environment boundaries
        run: |
          context="$RUNNER_TEMP/private-env-context"
          output="$RUNNER_TEMP/private-env-output"
          mkdir -p "$context/nested"
          cp .gitignore .dockerignore "$context/"
          for directory in "$context" "$context/nested"; do
            for file in .env .env.production .env.backup .env.example; do
              printf 'synthetic canary only\n' > "$directory/$file"
            done
          done
          git -C "$context" init -q
          for prefix in "" "nested/"; do
            for file in .env .env.production .env.backup; do
              git -C "$context" check-ignore --quiet --no-index "${prefix}${file}"
            done
            if git -C "$context" check-ignore --quiet --no-index "${prefix}.env.example"; then
              echo 'Public environment example must remain available'
              exit 1
            fi
          done
          printf 'FROM scratch\nCOPY . /context/\n' > "$context/Dockerfile"
          docker build --output "type=local,dest=$output" "$context"
          for prefix in "" "nested/"; do
            for file in .env .env.production .env.backup; do
              test ! -e "$output/context/${prefix}${file}"
            done
            test -f "$output/context/${prefix}.env.example"
          done
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml config --quiet
          docker compose config --format json > compose-runtime.json
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml config --format json > compose-dev.json
          python - <<'PY'
          import json
          runtime = json.load(open("compose-runtime.json"))["services"]["app"]
          development = json.load(open("compose-dev.json"))["services"]["app"]
          assert [(v["type"], v["target"]) for v in runtime["volumes"]] == [("volume", "/state")]
          assert runtime["image"] == "cautious-crypto-bro:local"
          assert development["image"] == "cautious-crypto-bro:dev"
          mounts = {v["target"]: v for v in development["volumes"]}
          assert mounts["/state"]["type"] == "volume"
          for target in ("/app/src", "/app/scripts"):
              assert mounts[target]["type"] == "bind" and mounts[target]["read_only"]
          PY
      - name: Build runtime image
        run: docker build --target runtime --tag cautious-crypto-bro:ci .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cautious-crypto-bro:ci
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          output: trivy-image.txt
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cautious-crypto-bro:ci
          format: cyclonedx
          output: sbom.cdx.json
      - name: Upload scan and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security
          path: |
            trivy-image.txt
            sbom.cdx.json
          if-no-files-found: error
      - name: Reject fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cautious-crypto-bro:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      # Full tests run once in Python / quality. Container job checks runtime
      # packaging and importability without executing same suite again.
      - name: Smoke test runtime image
        run: docker run --rm cautious-crypto-bro:ci /app/.venv/bin/python -c "import cautious_crypto_bro; print('import ok')"
