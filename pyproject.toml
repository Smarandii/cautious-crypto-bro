[project]
name = "cautious-crypto-bro"
version = "0.1.0"
description = "Human-in-the-loop Telegram crypto signal interpreter and Bybit demo executor"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.31,<4",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "telethon>=1.40,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
cautious-crypto-bro = "cautious_crypto_bro.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cautious_crypto_bro"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
