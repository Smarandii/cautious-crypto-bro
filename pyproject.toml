[project]
name = "cautious-crypto-bro"
version = "2.0.0"
description = "Human-in-the-loop Telegram crypto signal interpreter and Bybit demo executor"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3.31,<4",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=8.1.0",
  "telethon>=1.40,<2",
]

[dependency-groups]
dev = [
  "fakeredis>=2.38.0",
  "pre-commit>=4.3,<5",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[project.scripts]
cautious-crypto-bro = "cautious_crypto_bro.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cautious_crypto_bro"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
