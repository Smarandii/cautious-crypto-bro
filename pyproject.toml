[project]
name = "cautious-crypto-bro"
version = "2.0.0"
description = "Human-in-the-loop Telegram crypto signal interpreter and Bybit demo executor"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3.31,<4",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=8.1.0",
  "telethon>=1.40,<2",
]

[dependency-groups]
dev = [
  "fakeredis>=2.38.0",
  "pre-commit>=4.3,<5",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.13,<1",
]

[project.scripts]
cautious-crypto-bro = "cautious_crypto_bro.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cautious_crypto_bro"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Coverage is part of the default invocation rather than a CI-only extra, so a
# local `pytest -q` and the pull request gate measure exactly the same thing.
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
# Application code only. Operator scripts and tests are linear run-once
# procedures and are excluded from the metric on purpose.
source = ["cautious_crypto_bro"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratchet, not a cliff. Branch coverage measures 78.87% today; a failure here
# means coverage moved down. Raise this every time coverage is improved.
# TODO: raise to 85 once the service and source-claiming paths are covered.
fail_under = 78
# Literal strings so the regex reaches coverage unescaped by TOML. The ellipsis
# pattern is anchored: an unanchored '...' matches almost every line.
exclude_also = [
  'if TYPE_CHECKING:',
  'raise NotImplementedError',
  '^\s*\.\.\.\s*$',
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "C901",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
]

# Complexity gate for application logic. Operator scripts and test
# fixtures stay exempt: they are linear run-once procedures.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["C901"]
"tests/*" = ["C901"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
# Measured clean at this level across all 48 files. `strict` is a separate piece
# of work: it reports 485 findings, 422 of them unknown-type propagation from
# third-party boundaries (httpx, aiogram, telethon), which needs explicit
# annotations at those seams rather than a config flip.
typeCheckingMode = "standard"
reportMissingTypeStubs = false
